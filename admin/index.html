<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>とらまめMondまとめ — 管理画面</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="topbar">
  <div>
    <div class="eyebrow">TORAMAME MOND ARCHIVE</div>
    <h1>管理画面</h1>
  </div>
  <div class="publish-area">
    <span id="publishStatus" class="publish-status">公開先：未設定</span>
    <div class="actions">
      <button id="logoutBtn" class="ghost" onclick="sessionStorage.removeItem('toramame_admin_key');sessionStorage.removeItem('toramame_admin_auth_time');location.href='/toramame-mond-archive/';return false;">ログアウト</button>
      <button id="publishSettingsBtn" class="ghost">公開設定</button>
      <button id="downloadBtn" class="ghost">JSONバックアップ</button>
      <button id="publishBtn" class="primary publish">公開する</button>
    </div>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">
    <div class="side-title">話題一覧</div>
    <div id="topicList"></div>
    <button id="newTopicBtn" class="new-topic">＋ 新しい話題</button>
  </aside>

  <section class="editor">

    <section class="site-settings" style="margin:0 0 28px;padding:22px;border:1px solid #ddd5ca;border-radius:16px;background:#fff;">
      <div class="section-head" style="margin-top:0">
        <div>
          <span class="eyebrow">SITE</span>
          <h3 style="margin:4px 0 0">サイト基本情報</h3>
        </div>
        <button id="saveSiteBtn" class="primary">基本情報を保存</button>
      </div>
      <div class="form-grid">
        <label>サイト名<input id="siteTitle"></label>
        <label>公開状態<input id="siteNotice"></label>
        <label class="wide">サブタイトル<textarea id="siteSubtitle" rows="2"></textarea></label>
      </div>
    </section>

    <div id="emptyState" class="empty">
      <h2>話題を選択してください</h2>
      <p>左の一覧から編集する話題を選べます。</p>
    </div>

    <div id="topicEditor" hidden>
      <div class="editor-head">
        <div>
          <span class="eyebrow">TOPIC</span>
          <h2 id="editorTitle"></h2>
        </div>
        <div class="actions">
          <button id="deleteTopicBtn" class="danger">話題を削除</button>
          <button id="saveTopicBtn" class="primary">保存</button>
        </div>
      </div>

      <div class="form-grid">
        <label>タイトル<input id="topicTitle"></label>
        <label>カテゴリ<input id="topicCategory"></label>
        <label class="wide">説明<textarea id="topicDescription" rows="2"></textarea></label>
        <label class="check"><input id="topicFeatured" type="checkbox"> PICK UPに表示</label>
      </div>

      <div class="section-head">
        <div>
          <span class="eyebrow">TREE</span>
          <h3>質問・回答ツリー</h3>
        </div>
        <button id="addRootBtn" class="secondary">＋ 最初の質問を追加</button>
      </div>
      <div id="treeEditor"></div>
    </div>
  </section>
</main>

<input id="fileInput" type="file" accept=".json,application/json" hidden>

<template id="nodeTemplate">
  <div class="node-editor">
    <div class="node-top">
      <span class="node-kind"></span>
      <button class="danger small delete-node">削除</button>
    </div>
    <label>質問<textarea class="node-question" rows="3"></textarea></label>
    <label>とらまめの回答<textarea class="node-answer" rows="3"></textarea></label>
    <div class="form-grid">
      <label>Mond URL<input class="node-mond"></label>
      <label>X URL<input class="node-x"></label>
    </div>
    <div class="child-actions">
      <button class="secondary small add-child">＋ この質問への関連質問を追加</button>
    </div>
    <div class="children-editor"></div>
  </div>
</template>



<script>
(async function(){
  const WORKER_URL = "https://toramame-mond-publish.yuzuponz12345.workers.dev";
  const KEY_NAME = "toramame_admin_key";
  const TIME_NAME = "toramame_admin_auth_time";
  const TTL = 30 * 60 * 1000;

  // Keep the publish destination configured for admin.js too.
  localStorage.setItem("toramame_publish_worker_url", WORKER_URL);

  document.documentElement.style.visibility = "hidden";

  function clearAuth(){
    sessionStorage.removeItem(KEY_NAME);
    sessionStorage.removeItem(TIME_NAME);
  }

  function isFresh(){
    const t = Number(sessionStorage.getItem(TIME_NAME) || 0);
    return !!t && (Date.now() - t) < TTL;
  }

  let key = isFresh() ? (sessionStorage.getItem(KEY_NAME) || "") : "";
  if(!isFresh()) clearAuth();

  while(true){
    if(!key){
      key = prompt("管理画面のパスワードを入力してください。") || "";
      if(!key){
        location.replace("/toramame-mond-archive/");
        return;
      }
    }

    try{
      const res = await fetch(WORKER_URL + "/auth", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Admin-Key": key
        },
        body: "{}"
      });

      if(res.ok){
        sessionStorage.setItem(KEY_NAME, key);
        sessionStorage.setItem(TIME_NAME, String(Date.now()));
        document.documentElement.style.visibility = "visible";

        // Only now start the admin application.
        const script = document.createElement("script");
        script.src = "admin.js?v=20260827-auth3";
        document.body.appendChild(script);
        return;
      }

      clearAuth();
      key = "";
      alert("パスワードが違います。");
    }catch(err){
      clearAuth();
      alert("認証サーバーに接続できません。");
      location.replace("/toramame-mond-archive/");
      return;
    }
  }
})();
</script>

</body>
</html>
