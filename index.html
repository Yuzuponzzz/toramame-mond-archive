<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>トラマメMondアーカイブ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <div class="container">
    <div class="eyebrow">MOND ARCHIVE</div>
    <h1 id="siteTitle"></h1>
    <p id="siteSubtitle"></p>
    <span class="notice" id="notice"></span>
  </div>
</header>
<main class="container">
  <section class="intro">
    <div>
      <div class="eyebrow">PICK UP</div>
      <h2>面白かったやり取りを、流れごと読む。</h2>
      <p>1つの質問だけでなく、その後につながった質問・回答もツリーで追えるようにするためのアーカイブです。</p>
    </div>
  </section>
  <div class="toolbar">
    <input id="search" type="search" placeholder="話題・質問・回答を検索">
    <div id="count"></div>
  </div>
  <section id="topics"></section>
</main>
<footer><div class="container">トラマメMondアーカイブ — prototype</div></footer>
<script>
const nl = s => (s || "").replace(/\n/g, "<br>");
const esc = s => (s || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DATA = null;

function nodeHTML(node, depth=0) {
  const children = (node.children || []).map(id => id).join(",");
  return `
  <article class="node depth-${Math.min(depth,4)}">
    <div class="qbox">
      <div class="label q">QUESTION</div>
      <div class="text">${nl(esc(node.question))}</div>
    </div>
    <div class="abox">
      <div class="label a">ANSWER</div>
      <div class="text answer">${nl(esc(node.answer))}</div>
      <div class="links">
        ${node.mond ? `<a href="${esc(node.mond)}" target="_blank" rel="noopener">Mondで見る ↗</a>` : ""}
        ${node.x ? `<a href="${esc(node.x)}" target="_blank" rel="noopener">Xで見る ↗</a>` : ""}
      </div>
    </div>
    <div class="children" data-children="${esc(children)}"></div>
  </article>`;
}
function flatten(nodes, out=[]) {
  for (const n of nodes) { out.push(n); if(n._children) flatten(n._children,out); }
  return out;
}
function render(query="") {
  const section = document.getElementById("topics");
  const q = query.trim().toLowerCase();
  let shown=0;
  section.innerHTML = "";
  for (const topic of DATA.topics) {
    const all = topic.nodes;
    const topicText = [topic.title, topic.description, topic.category, ...all.flatMap(n=>[n.question,n.answer])].join(" ").toLowerCase();
    if(q && !topicText.includes(q)) continue;
    shown++;
    const wrap = document.createElement("section");
    wrap.className = "topic";
    wrap.innerHTML = `<div class="topic-head"><div><span class="cat">${esc(topic.category)}</span><h2>${esc(topic.title)}</h2><p>${esc(topic.description)}</p></div>${topic.featured?'<span class="featured">PICK UP</span>':''}</div><div class="tree"></div>`;
    const tree = wrap.querySelector(".tree");
    const byId = Object.fromEntries(all.map(n=>[n.id,n]));
    function draw(id, parent) {
      const n = byId[id]; if(!n) return;
      const holder = document.createElement("div");
      holder.innerHTML = nodeHTML(n, n.depth||0);
      const el = holder.firstElementChild;
      parent.appendChild(el);
      const childBox = el.querySelector(".children");
      (n.children||[]).forEach(cid=>draw(cid,childBox));
    }
    all.filter(n=>n.type==="root").forEach(n=>draw(n.id,tree));
    section.appendChild(wrap);
  }
  document.getElementById("count").textContent = `${shown} topics`;
}
async function init(){
  DATA = await fetch("data.json").then(r=>r.json());
  document.getElementById("siteTitle").textContent=DATA.site.title;
  document.getElementById("siteSubtitle").textContent=DATA.site.subtitle;
  document.getElementById("notice").textContent=DATA.site.notice;
  render();
  document.getElementById("search").addEventListener("input", e=>render(e.target.value));
}
init();
</script>
</body>
</html>
