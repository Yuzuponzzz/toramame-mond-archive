<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>とらまめMondまとめ</title><style>
:root{--bg:#f4f1eb;--card:#fff;--soft:#faf9f6;--ink:#18212b;--muted:#687483;--line:#ddd8d0;--dark:#202226}*{box-sizing:border-box}html{margin:0;padding:0}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.8}.wrap{width:min(980px,calc(100% - 40px));margin:auto}.hero{background:var(--dark);color:white;padding:52px 0 50px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#aeb4bb}.hero h1{font-size:clamp(34px,6vw,54px);line-height:1.15;margin:10px 0}.hero p{margin:0;color:#d6d9dd;font-size:16px}.badge{display:inline-block;margin-top:20px;padding:4px 12px;border:1px solid #656a70;border-radius:999px;font-size:11px;color:#ddd}main{padding:34px 0 70px}.intro{padding:30px 32px;background:var(--card);border-radius:20px;box-shadow:0 12px 32px rgba(0,0,0,.055);margin-bottom:26px}.intro h2{font-size:27px;line-height:1.4;margin:8px 0}.intro p{margin:0;color:var(--muted)}.toolbar{display:flex;align-items:center;gap:14px;margin-bottom:34px}.search{flex:1;height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 15px;font:inherit;color:var(--ink);outline:none}.count{font-size:12px;color:#7b838d;white-space:nowrap}.topic{margin-bottom:58px}.topic-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.category{display:inline-block;background:#e8e5de;border-radius:999px;padding:2px 9px;font-size:10px;font-weight:800;letter-spacing:.1em}.topic h2{font-size:28px;line-height:1.35;margin:8px 0 2px}.desc{margin:0;color:#747d87}.pick{background:var(--dark);color:#fff;border-radius:999px;padding:4px 11px;font-size:10px;font-weight:800;letter-spacing:.12em;white-space:nowrap}.tree{position:relative;padding-left:34px}.tree:before{content:"";position:absolute;left:0;top:22px;bottom:20px;width:1px;background:#d3cec5}.node{position:relative;margin-bottom:20px}.node:before{content:"";position:absolute;left:0;top:35px;width:34px;height:1px;background:#d3cec5}.card{background:var(--card);border:1px solid var(--line);padding:20px 22px}.question{border-radius:16px 16px 10px 10px;background:var(--soft)}.answer{border-radius:10px 16px 16px 16px;margin-top:12px;margin-left:26px;position:relative}.answer:before{content:"";position:absolute;left:-14px;top:0;width:1px;height:100%;background:#e0dbd3}.label{display:flex;align-items:center;gap:8px;min-height:28px;color:#7a838d;font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;line-height:1}.avatar{display:block!important;width:28px!important;height:28px!important;min-width:28px!important;max-width:28px!important;min-height:28px!important;max-height:28px!important;flex:0 0 28px!important;border-radius:50%!important;object-fit:cover!important;margin:0!important;padding:0!important}.name{font-size:11px;font-weight:700;letter-spacing:0;text-transform:none;color:#707983;margin-left:1px}.body{margin-top:12px;font-size:16px;overflow-wrap:anywhere}.answer .body{font-size:17px}.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12px}.links a{color:#66717c}footer{background:var(--dark);color:#999;padding:28px 0;font-size:11px}@media(max-width:650px){.wrap{width:calc(100% - 24px)}.hero{padding:40px 0}.intro{padding:23px}.intro h2{font-size:23px}.toolbar{display:block}.count{margin-top:7px}.topic-head{display:block}.pick{display:inline-block;margin-top:12px}.tree{padding-left:20px}.node:before{width:20px}.answer{margin-left:14px}.answer:before{left:-8px}.card{padding:17px}.avatar{width:26px!important;height:26px!important;min-width:26px!important;max-width:26px!important;min-height:26px!important;max-height:26px!important;flex-basis:26px!important}}

.today-updates{padding:20px 22px}
#todayUpdates{display:grid;gap:8px;margin-top:12px}
.today-item{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;text-align:left;border:1px solid #ded8cf;background:#fff;border-radius:10px;padding:11px 13px;cursor:pointer}
.today-item strong{font-size:13px}
.today-item span{font-size:10px;color:#777;white-space:nowrap}
#todayUpdates>p{margin:8px 0 0;color:#777;font-size:12px}
@media(max-width:650px){.today-item{align-items:flex-start;flex-direction:column;gap:3px}}


.topic-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topic-title-row h2{margin-right:auto}
.topic-link-btn{
  border:1px solid #d8d2c9;
  background:#fff;
  color:#687483;
  border-radius:999px;
  padding:4px 10px;
  font-size:10px;
  cursor:pointer;
}
.topic-link-btn:hover{background:#f7f5f1}
.topic:target{scroll-margin-top:20px}
.topic.flash{animation:topicFlash 1.2s ease}
@keyframes topicFlash{0%{filter:brightness(.97)}50%{filter:brightness(1.04)}100%{filter:none}}


.search-wrap{display:flex;gap:8px;flex:1;min-width:0}
.clear-search{
  border:1px solid #d8d2c9;
  background:#fff;
  color:#687483;
  border-radius:10px;
  padding:0 12px;
  font-size:11px;
  cursor:pointer;
}
.search-hit{
  outline:2px solid rgba(115,125,135,.12);
  outline-offset:3px;
}
.search-empty{
  background:#fff;
  border:1px solid #ddd8d0;
  border-radius:14px;
  padding:22px;
  color:#707983;
  font-size:13px;
}
@media(max-width:650px){
  .search-wrap{width:100%}
  .clear-search{flex:0 0 auto}
}

</style></head><body>
<header class="hero"><div class="wrap"><div class="eyebrow">MOND ARCHIVE</div><h1 id="siteTitle">とらまめMondまとめ</h1><p id="siteSubtitle">とらまめのMond回答を読者目線でピックアップ</p><span id="siteNotice" class="badge">試作版・公開前</span></div></header>
<main class="wrap"><section class="intro today-updates">
  <div class="eyebrow">TODAY</div>
  <h2>本日の更新</h2>
  <div id="todayUpdates"><p>本日の更新はありません。</p></div>
</section><div class="toolbar">
  <div class="search-wrap">
    <input id="search" class="search" type="search" placeholder="話題名・カテゴリ・質問・回答を検索" autocomplete="off">
    <button id="clearSearch" class="clear-search" type="button" hidden>クリア</button>
  </div>
  <span id="count" class="count"></span>
</div><section id="topics"></section></main><footer><div class="wrap" style="display:flex;justify-content:space-between;gap:16px;align-items:center"><span>とらまめMondまとめ — prototype</span><a href="admin/" style="color:#777;text-decoration:none;font-size:11px">管理</a></div></footer>
<script>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');

function nodeHTML(n){
  return `<article class="node">
    <div class="card question">
      <div class="label"><img class="avatar" src="anonymous.svg" alt="匿名"><span>QUESTION</span><span class="name">匿名</span></div>
      <div class="body">${nl(n.question)}</div>
    </div>
    <div class="card answer">
      <div class="label"><img class="avatar" src="toramame-icon.jpg" alt="とらまめ"><span>ANSWER</span><span class="name">とらまめ</span></div>
      <div class="body">${nl(n.answer)}</div>
      <div class="links">
        ${n.mond?`<a href="${esc(n.mond)}" target="_blank" rel="noopener">Mondで見る ↗</a>`:''}
        ${n.x?`<a href="${esc(n.x)}" target="_blank" rel="noopener">Xで見る ↗</a>`:''}
      </div>
    </div>
    <div class="children"></div>
  </article>`;
}

function localDateKey(value){
  const d=value instanceof Date ? value : new Date(value);
  if(Number.isNaN(d.getTime())) return "";
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
}

async function init(){
  const response=await fetch('data.json?v='+Date.now(),{cache:'no-store'});
  if(!response.ok) throw new Error('data.json '+response.status);

  const data=await response.json();
  const sec=document.getElementById('topics');
  const site=data.site||{};

  document.getElementById('siteTitle').textContent=site.title||'とらまめMondまとめ';
  document.getElementById('siteSubtitle').textContent=site.subtitle||'';
  document.getElementById('siteNotice').textContent=site.notice||'';

  const todayBox=document.getElementById('todayUpdates');
  const todayKey=localDateKey(new Date());
  const todays=(data.topics||[])
    .filter(t=>t.updatedAt && localDateKey(t.updatedAt)===todayKey)
    .sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));

  if(todays.length){
    const labels={created:"新しい話題を追加",question:"質問を追加",related:"関連質問を追加",updated:"内容を更新"};
    todayBox.innerHTML=todays.map(t=>`
      <button class="today-item" data-topic-id="${esc(t.id)}">
        <strong>${esc(t.title)}</strong>
        <span>${esc(labels[t.lastUpdateKind]||"内容を更新")}</span>
      </button>
    `).join('');
  }else{
    todayBox.innerHTML='<p>本日の更新はありません。</p>';
  }

  function render(query=''){
    const q=query.trim().toLowerCase();
    sec.innerHTML='';
    let shown=0;

    for(const t of (data.topics||[])){
      const allNodes=[];
      const collectNode=n=>{
        if(!n)return;
        allNodes.push(n);
        for(const child of (n.children||[])){
          if(typeof child==='object') collectNode(child);
        }
      };
      for(const n of (t.nodes||[])) collectNode(n);

      const fields=[
        t.title||'',
        t.category||'',
        t.description||'',
        ...allNodes.flatMap(n=>[n.question||'',n.answer||''])
      ].map(v=>String(v).toLowerCase());

      const matched=!q || fields.some(v=>v.includes(q));
      if(!matched) continue;

      shown++;

      const wrap=document.createElement('section');
      wrap.className='topic'+(q?' search-hit':'');
      wrap.id='topic-'+t.id;
      wrap.innerHTML=`<div class="topic-head"><div style="width:100%"><span class="category">${esc(t.category)}</span><div class="topic-title-row"><h2>${esc(t.title)}</h2><button class="topic-link-btn" data-copy-topic="${esc(t.id)}" type="button">リンクをコピー</button></div><p class="desc">${esc(t.description)}</p></div></div><div class="tree"></div>`;

      const tree=wrap.querySelector('.tree');
      const byId=Object.fromEntries((t.nodes||[]).filter(n=>n&&n.id).map(n=>[n.id,n]));

      function drawNode(n,parent){
        if(!n)return;
        const h=document.createElement('div');
        h.innerHTML=nodeHTML(n);
        const el=h.firstElementChild;
        parent.appendChild(el);
        const ch=el.querySelector('.children');

        for(const child of (n.children||[])){
          if(typeof child==='string') drawNode(byId[child],ch);
          else drawNode(child,ch);
        }
      }

      for(const n of (t.nodes||[])){
        if(n.type==='root') drawNode(n,tree);
      }

      sec.appendChild(wrap);
    }

    const count=document.getElementById('count');
    if(q){
      count.textContent=`${shown}件ヒット`;
      if(shown===0){
        sec.innerHTML='<div class="search-empty">一致する話題・質問・回答はありません。</div>';
      }
    }else{
      count.textContent=`${shown} topics`;
    }
  }

  render();

  function jumpToHash(){
    const raw=decodeURIComponent(location.hash.replace(/^#/,''));
    if(!raw)return;
    const target=document.getElementById(raw);
    if(target){
      requestAnimationFrame(()=>{
        target.scrollIntoView({behavior:'smooth',block:'start'});
        target.classList.add('flash');
        setTimeout(()=>target.classList.remove('flash'),1300);
      });
    }
  }

  document.addEventListener('click',async e=>{
    const btn=e.target.closest('[data-copy-topic]');
    if(!btn)return;
    const id='topic-'+btn.dataset.copyTopic;
    const url=location.origin+location.pathname+'#'+encodeURIComponent(id);
    try{
      await navigator.clipboard.writeText(url);
      const old=btn.textContent;
      btn.textContent='コピーしました';
      setTimeout(()=>btn.textContent=old,1200);
    }catch{
      prompt('このURLをコピーしてください。',url);
    }
  });

  window.addEventListener('hashchange',jumpToHash);
  jumpToHash();

  const searchInput=document.getElementById('search');
  const clearSearch=document.getElementById('clearSearch');

  searchInput.addEventListener('input',e=>{
    const value=e.target.value;
    clearSearch.hidden=!value;
    render(value);
  });

  clearSearch.addEventListener('click',()=>{
    searchInput.value='';
    clearSearch.hidden=true;
    render('');
    searchInput.focus();
  });

  document.querySelectorAll('.today-item').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const target=document.getElementById('topic-'+btn.dataset.topicId);
      if(target) target.scrollIntoView({behavior:'smooth',block:'start'});
    });
  });
}

init().catch(err=>{
  console.error(err);
  document.getElementById('topics').innerHTML='<p>データの読み込みに失敗しました。</p>';
});

</script></body></html>
