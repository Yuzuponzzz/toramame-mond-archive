<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>とらまめMondまとめ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <div class="container">
    <div class="eyebrow">MOND ARCHIVE</div>
    <h1>とらまめMondまとめ</h1>
    <p>とらまめのMond回答から、面白かったやり取りを話題ごとに整理するアーカイブ。</p>
    <span class="notice">試作版・公開前</span>
  </div>
</header>
<main class="container">
  <section class="intro">
    <div class="eyebrow">PICK UP</div>
    <h2>面白かったやり取りを、流れごと読む。</h2>
    <p>1つの質問だけでなく、その後につながった質問・回答もツリーで追えるようにするためのアーカイブです。</p>
  </section>
  <div class="toolbar">
    <input id="search" type="search" placeholder="話題・質問・回答を検索">
    <div id="count"></div>
  </div>
  <section id="topics"></section>
</main>
<footer><div class="container">とらまめMondまとめ — prototype</div></footer>
<script>
const esc = s => (s || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g, "<br>");

function nodeHTML(node) {
  return `
  <article class="node">
    <div class="qbox">
      <div class="label">
        <img class="label-avatar" src="anonymous.svg" alt="">
        <span>QUESTION</span>
        <span class="speaker-name">匿名</span>
      </div>
      <div class="text">${nl(node.question)}</div>
    </div>

    <div class="reply">
      <div class="abox">
        <div class="label">
          <img class="label-avatar" src="toramame-icon.jpg" alt="">
          <span>ANSWER</span>
          <span class="speaker-name">とらまめ</span>
        </div>
        <div class="text answer">${nl(node.answer)}</div>
        <div class="links">
          ${node.mond ? `<a href="${esc(node.mond)}" target="_blank" rel="noopener">Mondで見る ↗</a>` : ""}
          ${node.x ? `<a href="${esc(node.x)}" target="_blank" rel="noopener">Xで見る ↗</a>` : ""}
        </div>
      </div>
    </div>
    <div class="children"></div>
  </article>`;
}

async function init(){
  const DATA = await fetch("data.json").then(r=>r.json());

  function render(query=""){
    const q=query.trim().toLowerCase();
    const section=document.getElementById("topics");
    section.innerHTML="";
    let shown=0;

    for(const topic of DATA.topics){
      const topicText=[topic.title,topic.description,topic.category,...topic.nodes.flatMap(n=>[n.question,n.answer])].join(" ").toLowerCase();
      if(q && !topicText.includes(q)) continue;
      shown++;

      const wrap=document.createElement("section");
      wrap.className="topic";
      wrap.innerHTML=`
        <div class="topic-head">
          <div>
            <span class="cat">${esc(topic.category)}</span>
            <h2>${esc(topic.title)}</h2>
            <p>${esc(topic.description)}</p>
          </div>
          ${topic.featured?'<span class="featured">PICK UP</span>':''}
        </div>
        <div class="tree"></div>`;

      const tree=wrap.querySelector(".tree");
      const byId=Object.fromEntries(topic.nodes.map(n=>[n.id,n]));

      function draw(id,parent,depth){
        const n=byId[id]; if(!n) return;
        const holder=document.createElement("div");
        holder.innerHTML=nodeHTML(n,depth);
        const el=holder.firstElementChild;
        parent.appendChild(el);
        const children=el.querySelector(".children");
        (n.children||[]).forEach(cid=>draw(cid,children,depth+1));
      }

      topic.nodes.filter(n=>n.type==="root").forEach(n=>draw(n.id,tree,0));
      section.appendChild(wrap);
    }
    document.getElementById("count").textContent=`${shown} topics`;
  }

  render();
  document.getElementById("search").addEventListener("input",e=>render(e.target.value));
}
init();
</script>
</body>
</html>
